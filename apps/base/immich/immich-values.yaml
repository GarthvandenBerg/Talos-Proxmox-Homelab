controllers:
  main:
    containers:
      main:
        image:
          tag: v3.4.2 # renovate: datasource=docker depName=ghcr.io/immich-app/immich-server
        env:
          DB_HOSTNAME: immich-db-rw.database-system.svc.cluster.local
          DB_USERNAME: immich
          DB_DATABASE_NAME: immich
          DB_VECTOR_EXTENSION: pgvector
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: immich-db-app
                key: password

immich:
  persistence:
    library:
      existingClaim: immich-nfs-pvc

valkey:
  enabled: true

server:
  service:
    main:
      enabled: true
      type: LoadBalancer
      annotations:
        lbipam.cilium.io/ips-pool: "local-pool"
        lbipam.cilium.io/ips: "192.168.2.205"
      ports:
        http:
          port: 2283