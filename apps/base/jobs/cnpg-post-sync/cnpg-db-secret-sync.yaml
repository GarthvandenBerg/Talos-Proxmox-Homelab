apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-secret-sync-sa
  namespace: app
  annotations:
    argocd.argoproj.io/sync-wave: "3"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: app-secret-sync-role
  annotations:
    argocd.argoproj.io/sync-wave: "3"
rules:
  - apiGroups: [""]
    resources: ["secrets", "services"]
    verbs: ["get", "list", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: app-secret-sync-binding
  annotations:
    argocd.argoproj.io/sync-wave: "3"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: app-secret-sync-role
subjects:
  - kind: ServiceAccount
    name: app-secret-sync-sa
    namespace: app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: allow-read-app-secrets
  namespace: database-system # Source namespace
  annotations:
    argocd.argoproj.io/sync-wave: "3"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-sync-sa-read-binding
  namespace: database-system # Source namespace
  annotations:
    argocd.argoproj.io/sync-wave: "3"
subjects:
  - kind: ServiceAccount
    name: app-secret-sync-sa
    namespace: app # Target namespace
roleRef:
  kind: Role
  name: allow-read-app-secrets
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: sync-app-db-secret
  namespace: app
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  ttlSecondsAfterFinished: 60
  template:
    spec:
      serviceAccountName: app-secret-sync-sa
      containers:
        - name: sync
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              set -eo pipefail
              echo "Starting App DB secret sync..."

              kubectl get secret app-db-app -n database-system -o yaml | \
              grep -vE '^  (uid|resourceVersion|creationTimestamp):' | \
              awk '/ownerReferences:/{flag=1;next} /^[^ ]/{flag=0} !flag' | \
              kubectl label --local -f - argocd.argoproj.io/instance- --dry-run=client -o yaml | \
              sed 's/namespace: database-system/namespace: app/' | \
              kubectl annotate --local -f - argocd.argoproj.io/compare-options=IgnoreExtraneous argocd.argoproj.io/sync-options=Prune=false --dry-run=client -o yaml | \
              kubectl apply -f -

              echo "Sync complete."
      restartPolicy: OnFailure
